name: Release Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Refresh About icons from official app repositories
        uses: CyberGems/CyberSnap/.github/actions/sync-suite-icons@80266c5b4ad7fa4c5768e2543a4c7c7a461fc8f7
        with:
          config: .github/about-icons.json

      - name: Validate release summary
        run: node .github/scripts/validate-release-summary.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile and Package Electron App
        # --publish never: packaging only. Artifact upload is handled below.
        # electron-builder otherwise auto-publishes on tags and fails without GH_TOKEN.
        run: npm run build && npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Build Artifacts to Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: CyberLauncher-Windows-Installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

      # Upload the freshly built binaries to VirusTotal so the SHA256 links in
      # the release body resolve as soon as the release is published (new
      # builds are unknown to VirusTotal until someone submits them). The
      # portable exe stays optional here, matching the "pending" rendering
      # in the release notes step below.
      - name: Scan installers with VirusTotal
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          $installerItem = Get-ChildItem -Path "./release" -Filter "CyberLauncher-Setup-*.exe" |
            Where-Object { $_.Name -notlike "*.blockmap*" } |
            Select-Object -First 1
          $portableItem = Get-ChildItem -Path "./release" -Filter "CyberLauncher-Portable-*.exe" |
            Where-Object { $_.Name -notlike "*.blockmap*" } |
            Select-Object -First 1
          if (-not $installerItem) {
            throw "Setup installer .exe not found in ./release"
          }
          if (-not $portableItem) {
            Write-Warning "Portable .exe not found in ./release; skipping its VirusTotal upload."
          }

          if ($env:VIRUSTOTAL_API_KEY) {
            function Upload-VirusTotal($filePath, $apiKey) {
              $item = Get-Item $filePath
              $sizeMb = [Math]::Round($item.Length / 1MB, 2)
              Write-Host "Uploading $filePath ($sizeMb MB) to VirusTotal..."
              $headers = @{ "x-apikey" = $apiKey }
              $url = "https://www.virustotal.com/api/v3/files"

              if ($item.Length -gt 30MB) {
                Write-Host "File exceeds 30MB ($sizeMb MB), requesting dedicated large-file upload endpoint from VirusTotal..."
                $urlResp = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/files/upload_url" -Method Get -Headers $headers -TimeoutSec 60
                $url = $urlResp.data
                Write-Host "Using dedicated endpoint: $url"
              }

              $resp = & curl.exe -s -S --fail -X POST -H "x-apikey: $apiKey" -F "file=@$filePath" "$url"
              Write-Host "Upload successful. Response: $resp"
            }

            try {
              Upload-VirusTotal $installerItem.FullName $env:VIRUSTOTAL_API_KEY
            } catch {
              Write-Warning "VirusTotal installer upload warning: $_"
            }

            if ($portableItem) {
              try {
                Upload-VirusTotal $portableItem.FullName $env:VIRUSTOTAL_API_KEY
              } catch {
                Write-Warning "VirusTotal portable upload warning: $_"
              }
            }
          } else {
            Write-Host "VIRUSTOTAL_API_KEY secret not found; skipping direct upload and using computed SHA256 hashes for reports."
          }

      - name: Fill release notes from template
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $versionNum = $tag.TrimStart("v")
          $installer = Get-ChildItem -Path "release" -Filter "CyberLauncher-Setup-*.exe" |
            Where-Object { $_.Name -notlike "*.blockmap*" } |
            Select-Object -First 1
          $installerHash = if ($installer) {
            (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          } else {
            "pending"
          }

          $portable = Get-ChildItem -Path "release" -Filter "CyberLauncher-Portable-*.exe" |
            Where-Object { $_.Name -notlike "*.blockmap*" } |
            Select-Object -First 1
          $portableHash = if ($portable) {
            (Get-FileHash $portable.FullName -Algorithm SHA256).Hash.ToLower()
          } else {
            "pending"
          }

          Write-Host "Installer: $($installer.FullName) [SHA256: $installerHash]"
          Write-Host "Portable: $($portable.FullName) [SHA256: $portableHash]"

          $template = [System.IO.File]::ReadAllText(".github/release-template.md", [System.Text.Encoding]::UTF8)
          $notes = $template.
            Replace("{{VERSION_NUM}}", $versionNum).
            Replace("{{VERSION}}", $tag).
            Replace("{{INSTALLER_HASH}}", $installerHash).
            Replace("{{PORTABLE_HASH}}", $portableHash)
          $utf8 = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("FINAL_RELEASE_NOTES.md", $notes, $utf8)

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: CyberLauncher ${{ github.ref_name }}
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          draft: true
          body_path: FINAL_RELEASE_NOTES.md
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # action-gh-release often keeps the existing body when the draft already exists.
      # Force-write notes (with SHA256) the same way CyberPaste does.
      - name: Publish checksums in release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --notes-file FINAL_RELEASE_NOTES.md
          Write-Host "Updated release body with installer checksums."
